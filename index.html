<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>샘플 데이터 분석 프로그램</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">

<style>

body{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;color:#1d2530;background:#f4f5f7;margin:0;line-height:1.7;font-size:16px}
.wrap{max-width:960px;margin:0 auto;background:#fff;padding:28px 40px 48px}
.bar{position:sticky;top:0;background:#fff;border-bottom:1px solid #e3e6ea;padding:10px 40px;display:flex;gap:8px;flex-wrap:wrap;z-index:5;max-width:960px;margin:0 auto;align-items:center}
.bar button,.bar label{border:1px solid #2F6FB0;background:#fff;color:#2F6FB0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;font-family:inherit}
.bar .p{background:#2F6FB0;color:#fff} #msg{font-size:13px;color:#2a7d3b} #src{font-size:12px;color:#667;margin-left:auto}
header{border-bottom:3px solid #2F6FB0;padding-bottom:12px;margin-bottom:8px;position:relative;padding-right:200px} .hlogo{position:absolute;right:0;top:0;height:46px} .keep{break-inside:avoid}
.tag{color:#2F6FB0;font-weight:700;font-size:15px} h1{margin:4px 0;font-size:29px} .meta{color:#556;font-size:15px;margin:0}
h2{font-size:22px;border-left:4px solid #2F6FB0;padding-left:10px;margin-top:34px}
table{border-collapse:collapse;width:100%;font-size:15px;margin:10px 0} th,td{border:1px solid #cfd5dc;padding:7px 7px;text-align:center}
th{background:#f1f3f6} .raw td{font-size:14px;line-height:1.35} .raw small{color:#B4570F;font-size:13px;font-weight:500}
td.lo{color:#b42318;font-weight:700} td.hi{color:#1f5fa6;font-weight:700} td.mid{color:#b26a00;font-weight:700} td.ok{color:#2a7d3b;font-weight:700}
.sum td:last-child,.act td:nth-child(2),.act td:nth-child(3){text-align:left}
figure{margin:14px 0} figcaption,.cap{font-size:14px;color:#556}
.verdict{background:#eef4fb;border-left:6px solid #2F6FB0;padding:14px 18px;margin:10px 0 16px;font-size:17px;white-space:pre-line}
.verdict b.k{display:inline-block;background:#2F6FB0;color:#fff;padding:1px 8px;border-radius:4px;margin-right:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} .box{border:1px solid #cfd5dc;border-radius:8px;padding:4px 16px;font-size:15.5px} .box h4{margin:10px 0 0;font-size:17px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px} .g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.ch{width:100%;height:350px} .ch.s{height:330px} .ch.t{height:370px} .ch.h{height:260px} .g3{gap:8px}
.auto{color:#8a6d00;font-size:12.5px;margin-left:6px}
@media(max-width:700px){.wrap,.bar{padding-left:16px;padding-right:16px}.grid2,.g2,.g3{grid-template-columns:1fr}}
@media print{.bar{display:none}.wrap{padding:0;max-width:none}body{background:#fff}section{break-inside:auto}figure{break-inside:avoid}}

.caution{border:1px solid #f0c36d;background:#fff8e6;border-radius:8px;padding:6px 16px 12px;margin:14px 0;font-size:15.5px}.caution h4{margin:8px 0 4px;color:#9a6200}.caution p{margin:4px 0 8px}.caution table{background:#fff}

.notes{border:1px solid #dde1e6;background:#f8fafc;border-radius:8px;padding:6px 16px 12px;margin:14px 0;font-size:15.5px}.notes h4{margin:8px 0 4px;color:#2F6FB0}.notes table{background:#fff}.notes td{text-align:left}

.ana{border:1px solid #c9d9ee;background:#f5f9ff;border-radius:8px;padding:6px 16px 10px;margin:12px 0;font-size:15.5px}.ana h4{margin:8px 0 4px;color:#2F6FB0;font-size:17px}.ana li{margin:4px 0}
.gl td{text-align:left;font-size:14.5px;vertical-align:top}
.caution h4,.notes h4{font-size:17px}

.sum.wide{font-size:14px}.sum.wide th,.sum.wide td{padding:6px 4px} table.tight{font-size:13.5px} table.tight th,table.tight td{padding:6px 3px}

.app{max-width:1040px;margin:0 auto;background:#fff;min-height:100vh}
.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e3e6ea}
.top1{display:flex;align-items:center;gap:10px;padding:10px 20px 6px;flex-wrap:wrap}
.top1 h1{font-size:17px;margin:0} #ver{font-size:11px;background:#eef4fb;color:#2F6FB0;border:1px solid #c9d9ee;border-radius:10px;padding:1px 8px;cursor:pointer}
#saved{font-size:11px;color:#889;margin-left:auto}
.acts{display:flex;gap:6px;flex-wrap:wrap;padding:0 20px 8px}
.acts button,.acts label{border:1px solid #2F6FB0;background:#fff;color:#2F6FB0;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;font-family:inherit}
.acts .p{background:#2F6FB0;color:#fff} .acts .sep{width:1px;background:#dde1e6;margin:0 4px}
.tabs{display:flex;gap:2px;padding:0 20px} .tabs button{border:0;background:none;padding:8px 14px;font-family:inherit;font-size:13.5px;color:#556;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:#2F6FB0;font-weight:700;border-bottom-color:#2F6FB0}
.pane{padding:16px 24px 40px} .pane h3{font-size:14.5px;margin:18px 0 8px;color:#2F6FB0} .pane h3 small{color:#889;font-weight:400;margin-left:6px}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px 14px} .form2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.pane label{display:flex;flex-direction:column;font-size:12.5px;color:#445;gap:3px} .pane label.full{margin-top:4px}
.pane input,.pane textarea{font-family:inherit;font-size:13px;padding:6px 8px;border:1px solid #cfd5dc;border-radius:5px;background:#fffbea}
.pane textarea{resize:vertical} .cfg input{width:100%;box-sizing:border-box}
.hint{font-size:12px;color:#778;margin:6px 0}
.bsel{display:flex;gap:6px;align-items:center;flex-wrap:wrap} .bsel button{border:1px solid #cfd5dc;background:#fff;padding:6px 12px;border-radius:6px;cursor:pointer;font-family:inherit}
.bsel button.on{background:#2F6FB0;color:#fff;border-color:#2F6FB0}
.gwrap{overflow-x:auto} table.grid{width:auto;min-width:100%} table.grid td{padding:0} table.grid th{font-size:12px;padding:4px 6px;white-space:nowrap}
table.grid input{width:58px;border:0;border-radius:0;text-align:center;padding:6px 2px;background:#fffbea} table.grid input:focus{outline:2px solid #2F6FB0;background:#fff}
table.grid input.bad{background:#fde2e2}
.mini{font-size:11.5px;border:1px solid #cfd5dc;background:#fff;border-radius:5px;padding:2px 8px;cursor:pointer;margin-left:8px;font-family:inherit;color:#556}
#pPrev{background:#f4f5f7;padding:16px 0} #pPrev .wrap{box-shadow:0 1px 4px rgba(0,0,0,.08)}
#rep.exporting{width:960px;max-width:960px} body.capturing #rep .hlogo,body.capturing #rep .auto{display:none!important} body.capturing #rep header{padding-right:0}
#log{position:absolute;right:20px;top:46px;background:#fff;border:1px solid #dde1e6;border-radius:8px;padding:10px 14px;width:360px;font-size:12.5px;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:20}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;z-index:50;font-size:15px;color:#2F6FB0;font-weight:700}
#msg{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#1d2530;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:60}
#msg:empty{display:none} #upd{position:sticky;top:0;z-index:30;background:#2F6FB0;color:#fff;padding:8px 16px;font-size:13px;text-align:center} #upd button{margin-left:8px;border:0;border-radius:4px;padding:3px 10px;cursor:pointer;font-family:inherit} #busy[hidden],#log[hidden]{display:none}
#bHelp{border:1px solid #E53935;background:#fff;color:#C62828;font-weight:700;padding:5px 12px;border-radius:16px;cursor:pointer;font-family:inherit;font-size:13px;margin-left:10px}
#bHelp:hover{background:#FDECEA} #help{position:fixed;inset:0;background:rgba(20,30,45,.5);z-index:45;display:flex;justify-content:center;align-items:flex-start;overflow:auto;padding:24px 10px} #help[hidden]{display:none}
.hbox{background:#fff;border-radius:10px;width:min(1080px,100%);padding:14px 24px 28px;box-shadow:0 8px 30px rgba(0,0,0,.25)} .hhead{display:flex;justify-content:space-between;align-items:center;position:sticky;top:-24px;background:#fff;padding:10px 0;font-size:17px;border-bottom:2px solid #2F6FB0;z-index:2}
.hnav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0} .hnav a{font-size:13px;color:#2F6FB0;border:1px solid #c9d9ee;border-radius:14px;padding:3px 10px;text-decoration:none}
.hstep{margin:22px 0 10px} .hstep h3{font-size:18px;margin:0 0 6px;color:#1d2530} .hstep h3 span{display:inline-block;background:#2F6FB0;color:#fff;border-radius:50%;width:26px;height:26px;text-align:center;line-height:26px;margin-right:8px;font-size:14px}
.hstep img{width:100%;border:1px solid #cfd5dc;border-radius:6px;margin:6px 0} .hstep ol{margin:4px 0 0 0;padding-left:22px;font-size:15px;line-height:1.7} .hstep ol li::marker{color:#E53935;font-weight:700}
.htip{background:#fff8e6;border:1px solid #f0c36d;border-radius:8px;padding:8px 14px;font-size:14px;margin-top:10px}
@media print{#help{display:none!important}}

input.unsure{outline:2px solid #f39c12!important;background:#fff0d6!important}

const PAL=['#2F6FB0','#D9822B','#7B4FB0','#1E9AA6','#8C5A2B','#C2417E','#5B6B7A','#B8A12C'],C1=PAL[0],C2=PAL[1],CT='#2E9E44',CU='#D62728',CLo='#1F5FD6',FONT="'Noto Sans KR','Malgun Gothic',sans-serif";
const $=s=>document.querySelector(s); const msg=t=>{$('#msg').textContent=t;setTimeout(()=>$('#msg').textContent='',3500)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- stats ----------
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const mn=a=>Math.min(...a),mx=a=>Math.max(...a);

function pageCuts(rep,scale,pagePx){// 빈 공간을 줄이는 쪽 나눔: 블록 경계 우선, 공간이 많이 남으면 그래프 행·표 행 사이에서 나눔
  const top=rep.getBoundingClientRect().top,B=el=>(el.getBoundingClientRect().bottom-top+3)*scale,T=el=>(el.getBoundingClientRect().top-top-3)*scale;
  const blocks=[...rep.querySelectorAll(':scope > header, :scope > section > *')];const ends=blocks.map(B);
  // 제목(h2/h3) 바로 뒤에서는 자르지 않음: keep 묶음 안의 첫 행/첫 그래프 이후부터 허용
  const fine=[];rep.querySelectorAll('tr, .ch, .chimg, figcaption').forEach(el=>{if(el.closest('thead'))return;fine.push(B(el))});
  const forced=[];
  const total=rep.scrollHeight*scale,cuts=[0];let pos=0;
  while(pos<total-2){const lim=pos+pagePx;if(lim>=total){cuts.push(total);break}
    const f=forced.find(s=>s>pos+pagePx*0.05&&s<=lim);if(f){cuts.push(f);pos=f;continue}

    ['2. 로트를 늘리려면 표 아래에 "6로트"처럼 행을 추가하고, 시편을 늘리려면 머리행에 11, 12…처럼 번호를 이어서 적으면 됩니다. (중량 표와 두께 표의 시편 번호를 똑같이 맞춰 주세요)'],
    ['3. 차수를 추가하려면 맨 아래에 기존 차수 묶음(■ 차수 줄부터 마지막 로트 줄까지)을 복사해 붙여넣고 차수 이름(B열)을 바꾸면 됩니다. 차수 사이에는 빈 줄을 한 줄 두세요.'],
    ['4. 「기본정보」 시트는 선택 사항입니다. 비워 두면 프로그램에 입력된 값을 그대로 씁니다.'],
    ['5. 저장한 뒤 프로그램의 [엑셀 양식 불러오기] 버튼으로 이 파일을 올리면 데이터가 입력됩니다.'],[''],
    ['주의: 「■ 차수」 글자, 「중량 (gsm)」·「두께 (t)」 머리글, 「1로트」 같은 로트 이름은 지우거나 바꾸지 마세요. 빈 칸은 미측정으로 처리됩니다.']];
  const ws0=XLSX.utils.aoa_to_sheet(guide);ws0['!cols']=[{wch:130}];XLSX.utils.book_append_sheet(wb,ws0,'사용방법');
  const aoa=[['시편 데이터 입력 — 차수별로 왼쪽 = 중량(gsm), 오른쪽 = 두께(t) / 행 = 로트, 열 = 시편 번호'],[]];const nmax=Math.max(...ST.n);
  ST.names.forEach((nm,b)=>{const L=ST.lots[b],n=ST.n[b],G=ST.grid[b],off=n+2;
    const r0=[];r0[0]='■ 차수';r0[1]=nm;r0[3]='로트 수';r0[4]=L;r0[5]='시편 수';r0[6]=n;aoa.push(r0);
    const hd=['중량 (gsm)',...Array.from({length:n},(_,p)=>p+1)];hd[off]='두께 (t)';for(let p=0;p<n;p++)hd[off+1+p]=p+1;aoa.push(hd);
    for(let l=0;l<L;l++){const r=[`${l+1}로트`];for(let p=0;p<n;p++){const g=G.g[l]?.[p],t=G.t[l]?.[p];r[1+p]=g??null;r[off+1+p]=t??null}r[off]=`${l+1}로트`;aoa.push(r)}
    aoa.push([])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=Array.from({length:2*nmax+3},(_,i)=>({wch:(i===0||i===nmax+1)?10:7}));XLSX.utils.book_append_sheet(wb,ws,'시편데이터');
  const info=[['항목','값'],...TPL_INFO.map(([l,k])=>[l,ST.info[k]??''])];const wi=XLSX.utils.aoa_to_sheet(info);wi['!cols']=[{wch:24},{wch:20}];XLSX.utils.book_append_sheet(wb,wi,'기본정보');
  wb.Workbook={Views:[{activeTab:1}]};
  const out=XLSX.write(wb,{type:'array',bookType:'xlsx'});await saveFile('시편데이터_입력양식.xlsx',new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}))}
function parseTpl(wb){const ws=wb.Sheets['시편데이터'];const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
  const S_=v=>String(v??'').trim(),num=v=>{if(v===''||v==null)return null;const x=+String(v).replace(',','.');return isFinite(x)?x:NaN};
  const order=[],map={};let bad=0,cnt=0;
  const add=(nm,l,p,k,v)=>{if(!map[nm]){map[nm]={L:0,n:0,c:{}};order.push(nm)}const B=map[nm];B.L=Math.max(B.L,l);B.n=Math.max(B.n,p);const key=`${l}-${p}`;B.c[key]=B.c[key]||{g:null,t:null};if(Number.isNaN(v)){bad++;v=null}B.c[key][k]=v};
  if(rows.some(r=>S_(r[0]).startsWith('■'))){// 가로 배열 양식
    let cur=null,gc=null,tc=null;
    rows.forEach(r=>{const a0=S_(r[0]);
      if(a0.startsWith('■')){let nm=S_(r[1])||a0.replace(/^■\s*(차수)?\s*/,'');if(!nm)nm=`${order.length+1}차`;cur=nm;gc=tc=null;if(!map[nm]){map[nm]={L:0,n:0,c:{}};order.push(nm)}return}
      if(!cur)return;
      if(a0.startsWith('중량')){gc=[];tc=[];let mode='g';for(let i=1;i<r.length;i++){const s=S_(r[i]);if(s.startsWith('두께')){mode='t';continue}const p=parseInt(s);if(p>=1)(mode==='g'?gc:tc).push([i,p])}return}
      const m=a0.match(/^(\d+)/);if(m&&gc){const l=+m[1];gc.forEach(([i,p])=>{const v=num(r[i]);if(v!=null)add(cur,l,p,'g',v);else add(cur,l,p,'g',null)});(tc||[]).forEach(([i,p])=>{const v=num(r[i]);add(cur,l,p,'t',v)})}})
  }else{// 세로(목록) 양식
    const head=(rows[0]||[]).map(x=>S_(x).replace(/\s/g,''));const ci=k=>head.findIndex(h=>h.startsWith(k));const cB=ci('차수'),cL=ci('로트'),cP=ci('시편'),cG=ci('중량'),cT=ci('두께');
    if([cB,cL,cP,cG,cT].some(i=>i<0))throw new Error('「시편데이터」 시트 형식을 알 수 없습니다. [엑셀 기본 양식 받기]로 새 양식을 받아 주세요');
    rows.slice(1).forEach(r=>{const nm=S_(r[cB]);if(!nm&&r.every(v=>v===''))return;const l=parseInt(r[cL]),p=parseInt(r[cP]);if(!nm||!(l>=1)||!(p>=1)){bad++;return}add(nm,l,p,'g',num(r[cG]));add(nm,l,p,'t',num(r[cT]))})}
  const used=order.filter(nm=>map[nm].L>0&&map[nm].n>0);
  if(!used.length)throw new Error('「시편데이터」 시트에서 데이터를 찾지 못했습니다');if(used.length>8)throw new Error('차수는 최대 8개까지 불러올 수 있습니다');
  const old=ST;const grid=used.map(nm=>{const B=map[nm];const g=Array.from({length:B.L},()=>Array(B.n).fill(null)),t=Array.from({length:B.L},()=>Array(B.n).fill(null));
    Object.entries(B.c).forEach(([k,v])=>{const [l,p]=k.split('-').map(Number);g[l-1][p-1]=v.g;t[l-1][p-1]=v.t;if(v.g!=null||v.t!=null)cnt++});return{g,t}});
  const info={...old.info};const wi=wb.Sheets['기본정보'];if(wi){XLSX.utils.sheet_to_json(wi,{header:1,defval:''}).slice(1).forEach(([k,v])=>{const f=TPL_INFO.find(x=>x[0]===String(k).trim());if(!f||v===''||v==null)return;if(f[1]==='date'&&v instanceof Date)v=new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10);info[f[1]]=['prd','date','author'].includes(f[1])?String(v):+v})}
  const remap=arr=>used.map(nm=>{const j=old.names.indexOf(nm);return j>=0?(arr[j]||''):''});
  const memos=remap(old.memos);old.checks.forEach(c=>c.r=remap(c.r));(old.texts.notes||[]).forEach(x=>x.r=remap(x.r));
  ST={...old,names:used,lots:used.map(nm=>map[nm].L),n:used.map(nm=>map[nm].n),grid,info,memos,unsure:used.map(()=>[])};
  return{cnt,bad,desc:used.map(nm=>`${nm} ${map[nm].L}로트×${map[nm].n}개`).join(', ')}}

$('#fXlsx').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!window.XLSX||!XLSX.read)throw new Error('엑셀 모듈을 불러오지 못했습니다');const buf=new Uint8Array(await f.arrayBuffer());
  const wb=XLSX.read(buf,{type:'array',cellDates:true});

const HELP=[
 ['기본 설정 — 목표와 시료 수량 정하기','s1',['제품명·작성일·작성자와 목표 중량·두께, 허용범위(중량·두께·밀도)를 입력합니다. 아래에 규격 범위와 목표 밀도가 자동 계산되어 표시됩니다.','차수마다 이름, 로트(채취) 수, 로트당 시편 수를 입력합니다. 입력한 수만큼 데이터 입력 칸이 만들어집니다.','「＋ 차수 추가」로 3차, 4차…를 늘릴 수 있습니다(최대 8개). 오른쪽 「삭제」를 두 번 누르면 차수가 지워집니다.'],'기본 스펙 외에 따로 확인할 기준은 같은 화면 아래 「주의사항 · 추가 점검 기준」에 적으면 보고서에 표시됩니다.'],
 ['시편 데이터 입력 — 직접 입력 또는 엑셀','s2',['입력할 차수를 고릅니다.','표에 중량(gsm)과 두께(t)를 입력합니다. 엑셀에서 여러 칸을 복사해 첫 칸에 붙여넣기(Ctrl+V)하면 한 번에 들어가고, Enter·방향키로 칸을 이동합니다.','엑셀로 입력하려면 「📥 엑셀 기본 양식 받기」로 양식을 내려받습니다. 차수별로 행 = 로트, 열 = 시편, 왼쪽 중량 표 · 오른쪽 두께 표로 되어 있습니다.','양식에 값을 넣고 저장한 뒤 「엑셀 양식 불러오기」로 올리면 차수·로트·시편 수까지 자동으로 맞춰서 입력됩니다.'],'입력한 내용은 이 PC의 브라우저에 자동 저장됩니다(오른쪽 위 「자동 저장됨」 표시).'],
