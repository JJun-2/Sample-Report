// ---------- stats ----------
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const mn=a=>Math.min(...a),mx=a=>Math.max(...a);
const corr=(x,y)=>{const mx_=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<x.length;i++){a+=(x[i]-mx_)*(y[i]-my);b+=(x[i]-mx_)**2;c+=(y[i]-my)**2}return a/Math.sqrt(b*c)};
const fit=(x,y)=>{const mx_=mean(x),my=mean(y);let a=0,b=0;for(let i=0;i<x.length;i++){a+=(x[i]-mx_)*(y[i]-my);b+=(x[i]-mx_)**2}const s=a/b;return[s,my-s*mx_]};
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h}
function lgamma(z){const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let x=z,y=z,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const c of g)s+=c/++y;return -t+Math.log(2.5066282746310005*s/x)}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
function welch(a,b){if(a.length<2||b.length<2)return NaN;const va=sd(a)**2/a.length,vb=sd(b)**2/b.length,t=(mean(a)-mean(b))/Math.sqrt(va+vb),df=(va+vb)**2/(va*va/(a.length-1)+vb*vb/(b.length-1));return ibeta(df/2,.5,df/(df+t*t))}
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*p,lo=Math.floor(i);return s[lo]+(s[Math.min(lo+1,s.length-1)]-s[lo])*(i-lo)};
const f0=v=>isFinite(v)?Math.round(v).toLocaleString('en-US').replace(/,/g,''):'-',f1=v=>isFinite(v)?v.toFixed(1):'-',f2=v=>isFinite(v)?v.toFixed(2):'-',f3=v=>isFinite(v)?v.toFixed(3):'-';
const pct=(v,d=1)=>isFinite(v)?(v*100).toFixed(d)+'%':'-',sp=(v,d=1)=>isFinite(v)?(v>=0?'+':'−')+Math.abs(v*100).toFixed(d)+'%':'-';
const pv=p=>!isFinite(p)?'-':p<0.001?'p &lt; 0.001':'p = '+p.toFixed(3);

function readXlsx(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true}); const si=wb.Sheets['입력']; if(!si) throw new Error('「입력」 시트를 찾을 수 없습니다.');
  const v=(sh,a)=>{const c=sh[a];return c?c.v:''};
  const D={names:[v(si,'C6')||'1차',v(si,'C7')||'2차'],lots:[+v(si,'E6')||0,+v(si,'E7')||0],n:[+v(si,'F6')||0,+v(si,'F7')||0],
    info:{prd:v(si,'E11'),date:v(si,'E12'),author:v(si,'E13'),tg:+v(si,'E14')||1430,tt:+v(si,'E15')||7.6,gTol:Math.round((+v(si,'E14')||1430)*(+v(si,'E16')||0.05)),tTol:+((+v(si,'E15')||7.6)*(+v(si,'E16')||0.05)).toFixed(2),memo1:v(si,'E18'),memo2:v(si,'E19')},data:[[],[]],texts:{}};
  if(D.info.date instanceof Date) D.info.date=D.info.date.toISOString().slice(0,10);
  [['E','F'],['K','L']].forEach((cols,b)=>{const N=D.lots[b]*D.n[b];for(let k=1;k<=N;k++){const r=23+k;const g=v(si,cols[0]+r),t=v(si,cols[1]+r);D.data[b].push([g===''?null:+g,t===''?null:+t])}});
  const st=wb.Sheets['보고서 문구'];
  if(st){D.texts={verdict:v(st,'C4'),eval:[7,8,9,10,11,12,13,14].map(r=>v(st,'C'+r)),look:[17,18,19,20].map(r=>v(st,'C'+r)),done:v(st,'C23'),todo:v(st,'C24'),
     act:[28,29,30,31,32,33].map(r=>[v(st,'C'+r),v(st,'H'+r)])};const lk=D.texts.look,ev=D.texts.eval;D.texts.notes=[['표면 상태',lk[0],lk[1],ev[6]],['웹 밀림',lk[2],lk[3],ev[7]]].filter(x=>x[1]||x[2]||x[3]).map(x=>({item:x[0],r1:x[1],r2:x[2],ev:x[3]}));D.texts.eval=[ev[0],ev[1],ev[2],'','',ev[3],ev[5]];delete D.texts.look}
  return D;
}
// ---------- analysis ----------
function analyze(D){
  const I=D.info,B=[0,1].map(b=>{
    const L=D.lots[b],n=D.n[b],rows=D.data[b].map((x,i)=>({lot:Math.floor(i/n)+1,pos:i%n+1,g:x[0],t:x[1]}));
    const seq=rows.filter(r=>r.g!=null||r.t!=null); const G=seq.filter(r=>r.g!=null).map(r=>r.g),T=seq.filter(r=>r.t!=null).map(r=>r.t);
    const pr=seq.filter(r=>r.g!=null&&r.t!=null),R=pr.map(r=>r.g/r.t*0.001);
    const lim=(arr)=>{const mr=[];for(let i=1;i<arr.length;i++)mr.push(Math.abs(arr[i]-arr[i-1]));const m=mean(arr),M=mean(mr);return{m,lcl:m-2.66*M,ucl:m+2.66*M,mr:M}};
    const lg=lim(seq.map(r=>r.g).filter(x=>x!=null)),lt=lim(seq.map(r=>r.t).filter(x=>x!=null));
    const outG=seq.filter(r=>r.g!=null&&(r.g<lg.lcl||r.g>lg.ucl)),outT=seq.filter(r=>r.t!=null&&(r.t<lt.lcl||r.t>lt.ucl));
    const inG=v=>Math.abs(v-I.tg)<=I.gTol+1e-9,inT=v=>Math.abs(v-I.tt)<=I.tTol+1e-9,trg=I.tg/I.tt*0.001,inR=v=>(+I.dTol>0)&&Math.abs(v-trg)<=I.dTol+1e-9;
    const grp=(key,N)=>Array.from({length:N},(_,i)=>{const s=rows.filter(r=>r[key]===i+1);const g=s.map(r=>r.g).filter(x=>x!=null),t=s.map(r=>r.t).filter(x=>x!=null);return{k:i+1,g:g.length?mean(g):NaN,gs:sd(g),t:t.length?mean(t):NaN,ts:sd(t)}});
    const byLot=grp('lot',L),byPos=grp('pos',n); const [s_,i_]=fit(pr.map(r=>r.g),pr.map(r=>r.t));
    return{name:D.names[b],L,n,rows,seq,G,T,R,pr,lg,lt,outG,outT,wG:G.filter(inG).length,wT:T.filter(inT).length,wGT:pr.filter(r=>inG(r.g)&&inT(r.t)).length,wR:R.filter(inR).length,byLot,byPos,r:corr(pr.map(r=>r.t),pr.map(r=>r.g)),pred:s_*I.tg+i_}
  });
  return{I,B,tr:I.tg/I.tt*0.001};
}

   ['CV (변동계수)','표준편차 ÷ 평균 × 100(%). 단위가 다른 항목끼리 산포를 비교할 때 쓴다. 작을수록 균일하다.'],

    const fz=z.flat().filter(v=>v!=null),zmin=fz.length?mn(fz):0,zmax=fz.length?mx(fz):1,nz=v=>(v-zmin)/((zmax-zmin)||1);document.getElementById(id).style.height=(70+B.L*Math.max(26,Math.min(40,260/B.L)))+'px';

function specTxt(){const I=ST.info,el=$('#specTxt');if(!el)return;const ok=isFinite(I.tg)&&isFinite(I.tt)&&I.tt>0;el.innerHTML=ok?`규격: 중량 <b>${f0(I.tg-(+I.gTol||0))} ~ ${f0(I.tg+(+I.gTol||0))} gsm</b>, 두께 <b>${f2(I.tt-(+I.tTol||0))} ~ ${f2(I.tt+(+I.tTol||0))} t</b>, 밀도 <b>${(I.tg/I.tt*0.001-(+I.dTol||0)).toFixed(3)} ~ ${(I.tg/I.tt*0.001+(+I.dTol||0)).toFixed(3)} g/cm³</b> (목표 밀도 ${(I.tg/I.tt*0.001).toFixed(3)} = 중량 ÷ 두께 × 0.001)`:''}

let curB=0;
function drawGrids(){

  [['g','중량 (gsm)','1'],['t','두께 (t)','0.01']].forEach(([k,nm,st])=>{

    h+=`<h3>${esc(ST.names[b])} ${nm} <small>${cnt} / ${L*n}개 입력</small> <button class="mini" data-clear="${k}">이 표 지우기</button></h3><div class="gwrap"><table class="grid"><tr><th>로트＼시편</th>${Array.from({length:n},(_,p)=>`<th>${p+1}</th>`).join('')}</tr>`;
    for(let l=0;l<L;l++){h+=`<tr><th>${l+1}로트</th>`;for(let p=0;p<n;p++){const v=G[k][l][p];const un=(ST.unsure[b]||[]).includes(`${k}-${l}-${p}`);h+=`<td><input class="${un?'unsure':''}" data-k="${k}" data-l="${l}" data-p="${p}" inputmode="decimal" value="${v==null?'':(k==='t'?(+v).toFixed(2):v)}"></td>`}h+='</tr>'}
    h+='</table></div>'});
  $('#pData').innerHTML=h;
  $('#pData').querySelectorAll('[data-bb]').forEach(x=>x.onclick=()=>{curB=+x.dataset.bb;drawGrids()});

    i.oninput=()=>{const v=i.value.trim().replace(',','.');G[i.dataset.k][+i.dataset.l][+i.dataset.p]=v===''||isNaN(+v)?null:+v;const key=`${i.dataset.k}-${i.dataset.l}-${i.dataset.p}`;if(ST.unsure[b].includes(key)){ST.unsure[b]=ST.unsure[b].filter(x=>x!==key);i.classList.remove('unsure')}i.classList.toggle('bad',v!==''&&isNaN(+v));autosave()};
    i.onpaste=e=>{const txt=(e.clipboardData||window.clipboardData).getData('text');if(!/[\t\n]/.test(txt.trim()))return;e.preventDefault();
      const rows=txt.replace(/\r/g,'').replace(/\n$/,'').split('\n').map(r=>r.split('\t'));const k=i.dataset.k,l0=+i.dataset.l,p0=+i.dataset.p;let c=0;
      rows.forEach((r,dl)=>r.forEach((v,dp)=>{const l=l0+dl,p=p0+dp;if(l<L&&p<n){const s=v.trim().replace(',','.');G[k][l][p]=s===''||isNaN(+s)?null:+s;c++}}));autosave();drawGrids();msg(c+'개 칸을 붙여넣었습니다')};

}

function preview(){const D=toD(ST);const bad=[0,1].filter(b=>!D.data[b].some(x=>x[0]!=null||x[1]!=null));
  if(bad.length){$('#rep').innerHTML='<p style="padding:40px;text-align:center;color:#b42318">'+bad.map(b=>esc(ST.names[b])).join(', ')+' 데이터가 비어 있습니다. ② 시편 데이터 탭에서 입력해 주세요.</p>';return false}
  try{render(D);return true}catch(e){$('#rep').innerHTML='<p style="color:#b42318">보고서를 만들 수 없습니다: '+esc(e.message)+'</p>';return false}}
let dl=null;(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}})();
async function saveFile(name,blob){
  if(dl){try{await dl.save({filename:name,data:blob});msg('저장했습니다: '+name)}catch(e){msg(e&&e.code==='declined'?'저장을 취소했습니다':'저장 실패: '+(e&&e.message||e))}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);msg('저장했습니다: '+name)}catch(e){msg('이 화면에서는 다운로드가 차단되었습니다')}}
const fname=ext=>`${(ST.info.prd||'OxyFelt').replace(/[\\/:*?"<>|]/g,'')}_조건셋업_보고서_${(ST.info.date||new Date().toISOString().slice(0,10))}.${ext}`;
async function chartsToImages(root,scale=2){const ds=[...root.querySelectorAll('.js-plotly-plot')];const swaps=await Promise.all(ds.map(async d=>{try{const w=d.clientWidth,h=d.clientHeight;const url=await Plotly.toImage(d,{format:'png',scale,width:w,height:h});const img=new Image();img.src=url;img.className='chimg';img.style.width=w+'px';img.style.aspectRatio=w+'/'+h;await img.decode().catch(()=>{});return[d,img]}catch(e){return null}}));
  swaps.filter(Boolean).forEach(([d,img])=>{d.style.display='none';d.parentNode.insertBefore(img,d)});return()=>swaps.filter(Boolean).forEach(([d,img])=>{img.remove();d.style.display=''})}
function busy(on,t){$('#busy').hidden=!on;if(t)$('#busyT').textContent=t}
const nextFrame=()=>new Promise(r=>requestAnimationFrame(()=>setTimeout(r,30)));
let lastKey='';
async function prepare(){const key=JSON.stringify(ST);if($('#pPrev').hidden||key!==lastKey){tab('pPrev');if(!preview())throw new Error('데이터를 먼저 입력해 주세요');lastKey=key;await nextFrame()}return await chartsToImages($('#rep'))}
let CAP=null; // {key, canvas, scale, cuts}
function pageCuts(rep,scale,pagePx){// 빈 공간을 줄이는 쪽 나눔: 블록 경계 우선, 공간이 많이 남으면 그래프 행·표 행 사이에서 나눔
  const top=rep.getBoundingClientRect().top,B=el=>(el.getBoundingClientRect().bottom-top+3)*scale,T=el=>(el.getBoundingClientRect().top-top-3)*scale;
  const blocks=[...rep.querySelectorAll(':scope > header, :scope > section > *')];const ends=blocks.map(B);
  // 제목(h2/h3) 바로 뒤에서는 자르지 않음: keep 묶음 안의 첫 행/첫 그래프 이후부터 허용
  const fine=[];rep.querySelectorAll('tr, .ch, .chimg, figcaption').forEach(el=>{if(el.closest('thead'))return;fine.push(B(el))});
  const forced=[];
  const total=rep.scrollHeight*scale,cuts=[0];let pos=0;
  while(pos<total-2){const lim=pos+pagePx;if(lim>=total){cuts.push(total);break}
    const f=forced.find(s=>s>pos+pagePx*0.05&&s<=lim);if(f){cuts.push(f);pos=f;continue}
    let cut=Math.max(...ends.filter(e=>e>pos&&e<=lim),-1);
    if(cut<pos+pagePx*0.8){const c2=Math.max(...fine.filter(e=>e>Math.max(cut,pos)&&e<=lim),-1);if(c2>cut)cut=c2}
    if(cut<=pos)cut=lim;cuts.push(cut);pos=cut}
  return cuts}
async function capture(){const key=JSON.stringify(ST);if(CAP&&CAP.key===key)return CAP;
  const restore=await prepare();document.body.classList.add('capturing');try{busy(true,'화면을 이미지로 변환하는 중…');await nextFrame();const rep=$('#rep');const scale=1.6;
    const c=await html2canvas(rep,{scale,backgroundColor:'#ffffff',useCORS:true,logging:false,imageTimeout:0,removeContainer:true,windowWidth:rep.scrollWidth});
    const W=190,H=263,pagePx=c.width*H/W;CAP={key,canvas:c,cuts:pageCuts(rep,scale,pagePx)};return CAP}finally{document.body.classList.remove('capturing');restore()}}
async function exportPNG(){if(!window.html2canvas)return msg('이미지 변환 모듈을 불러오지 못했습니다(인터넷 연결 확인)');busy(true,'이미지 만드는 중…');
  try{const {canvas}=await capture();busy(true,'파일 만드는 중…');const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));busy(false);await saveFile(fname('png'),blob)}
  catch(e){msg('이미지 만들기 실패: '+e.message)}finally{busy(false)}}
async function exportPDF(){if(!window.html2canvas||!window.jspdf)return msg('PDF 변환 모듈을 불러오지 못했습니다(인터넷 연결 확인)');busy(true,'PDF 만드는 중…');
  try{const {canvas:c,cuts}=await capture();const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait',compress:true});
    const PW=210,PH=297,M=10,W=190,k=c.width/W;const n=cuts.length-1;
    for(let i=0;i<n;i++){busy(true,`PDF 만드는 중… (${i+1}/${n}쪽)`);if(i)pdf.addPage();const y0=cuts[i],h=cuts[i+1]-y0;const s=document.createElement('canvas');s.width=c.width;s.height=Math.ceil(h);const g=s.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,s.width,s.height);g.drawImage(c,0,y0,c.width,h,0,0,c.width,h);
      pdf.addImage(s.toDataURL('image/jpeg',0.9),'JPEG',M,20,W,h/k,undefined,'FAST');pdf.addImage(LOGO,'PNG',PW-M-42,7,42,42*59/306,'logo','FAST');pdf.setFontSize(9);pdf.setTextColor(140);pdf.text(`${i+1} / ${n}`,PW/2,PH-5,{align:'center'});if(i%3===2)await nextFrame()}
    const blob=pdf.output('blob');busy(false);await saveFile(fname('pdf'),blob)}
  catch(e){msg('PDF 만들기 실패: '+e.message)}finally{busy(false)}}
async function doPrint(){busy(true,'인쇄 준비 중…');let restore=()=>{};try{restore=await prepare();document.body.classList.add('printing');busy(false);await nextFrame();
    const done=()=>{document.body.classList.remove('printing');restore();window.removeEventListener('afterprint',done)};window.addEventListener('afterprint',done);
    try{window.print()}catch(e){done();msg('이 화면에서는 인쇄가 차단되었습니다')}}catch(e){restore();msg('인쇄 준비 실패: '+e.message)}finally{busy(false)}}
$('#bPNG').onclick=exportPNG;$('#bPDF').onclick=exportPDF;$('#bPrint2').onclick=doPrint;
// ---------- work file ----------
$('#bSave').onclick=()=>saveFile(fname('json').replace('_보고서_','_작업_'),new Blob([JSON.stringify({app:'oxyfelt-report',ver:APP_VERSION,state:ST},null,1)],{type:'application/json'}));
$('#fJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.state)throw new Error('작업 파일 형식이 아닙니다');ST=o.state;ensureTexts();drawAll();autosave();msg('작업을 불러왔습니다: '+f.name)}catch(err){msg('불러오기 실패: '+err.message)}e.target.value=''};
$('#fXlsx').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!window.XLSX||!XLSX.read)throw new Error('엑셀 모듈을 불러오지 못했습니다');const D=readXlsx(new Uint8Array(await f.arrayBuffer()));const t=D.texts&&Object.keys(D.texts).length?D.texts:ST.texts;ST=fromD({...D,texts:t});ST.unsure=[[],[]];ensureTexts();drawAll();autosave();msg('엑셀을 불러왔습니다: '+f.name)}catch(err){msg('엑셀 불러오기 실패: '+err.message)}e.target.value=''};
$('#bNew').onclick=()=>{const x=$('#bNew');if(!x.dataset.ok){x.dataset.ok=1;x.textContent='정말 새로 시작? 한 번 더';setTimeout(()=>{delete x.dataset.ok;x.textContent='새로 시작'},3000);return}
  ST={names:['1차','2차'],lots:[5,5],n:[10,10],info:{prd:'',date:new Date().toISOString().slice(0,10),author:'',tg:ST.info.tg,tt:ST.info.tt,gTol:ST.info.gTol,tTol:ST.info.tTol,dTol:ST.info.dTol,memo1:'',memo2:''},grid:[0,1].map(()=>({g:Array.from({length:5},()=>Array(10).fill(null)),t:Array.from({length:5},()=>Array(10).fill(null))})),texts:{},checks:ST.checks.map(c=>({item:c.item,std:c.std,r1:'',r2:'',judge:''})),caution:ST.caution,unsure:[[],[]]};ensureTexts();drawAll();autosave();delete x.dataset.ok;x.textContent='새로 시작';msg('빈 양식으로 시작합니다(목표값은 유지)')};
$('#bEx').onclick=()=>{ST=fromD(DEF);ST.unsure=[[],[]];ensureTexts();drawAll();autosave();msg('예시 데이터를 불러왔습니다')};
// ---------- version ----------
$('#ver').textContent='v'+APP_VERSION;
$('#ver').onclick=()=>{$('#log').hidden=!$('#log').hidden};
$('#log').innerHTML='<b>업데이트 내역</b><ul>'+CHANGELOG.map(([v,d,t])=>`<li><b>v${v}</b> (${d}) ${esc(t)}</li>`).join('')+'</ul><p class="hint">관리자가 새 버전을 배포하면 이 링크를 여는 모든 사용자에게 자동 적용됩니다. 입력한 데이터는 각자의 브라우저에 자동 저장되며 업데이트 후에도 유지됩니다.</p>';
if(saved&&saved.ver&&saved.ver!==APP_VERSION){setTimeout(()=>msg(`v${APP_VERSION}(으)로 업데이트되었습니다. 업데이트 내역은 버전 표시를 누르세요.`),600)}
function drawAll(){drawSettings();drawTexts();if(!$('#pData').hidden)drawGrids();if(!$('#pPrev').hidden)preview()}
drawSettings();drawTexts();tab('pSet');

// ---------- 새 버전 확인 (웹 호스팅 시) ----------
(function(){if(!/^https?:/.test(location.protocol)||/claude/.test(location.hostname))return;
  const chk=async()=>{try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();
    if(v.version&&v.version!==APP_VERSION&&!document.getElementById('upd')){const d=document.createElement('div');d.id='upd';
      d.innerHTML=`새 버전 v${esc(v.version)}이 배포되었습니다. ${esc(v.note||'')} <button>지금 적용(새로고침)</button>`;d.querySelector('button').onclick=()=>location.reload();document.body.prepend(d)}}catch(e){}};
  setTimeout(chk,3000);setInterval(chk,10*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})})();
