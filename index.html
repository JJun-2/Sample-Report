<script>
const C1='#2F6FB0',C2='#D9822B',CT='#C0392B',FONT="'Noto Sans KR','Malgun Gothic',sans-serif";
const $=s=>document.querySelector(s); const msg=t=>{$('#msg').textContent=t;setTimeout(()=>$('#msg').textContent='',3500)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// ---------- stats ----------
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length-1))};
const mn=a=>Math.min(...a),mx=a=>Math.max(...a);
const corr=(x,y)=>{const mx_=mean(x),my=mean(y);let a=0,b=0,c=0;for(let i=0;i<x.length;i++){a+=(x[i]-mx_)*(y[i]-my);b+=(x[i]-mx_)**2;c+=(y[i]-my)**2}return a/Math.sqrt(b*c)};
const fit=(x,y)=>{const mx_=mean(x),my=mean(y);let a=0,b=0;for(let i=0;i<x.length;i++){a+=(x[i]-mx_)*(y[i]-my);b+=(x[i]-mx_)**2}const s=a/b;return[s,my-s*mx_]};
function betacf(a,b,x){let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<1e-30)d=1e-30;d=1/d;let h=d;for(let m=1;m<=200;m++){let m2=2*m,aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<1e-30)d=1e-30;c=1+aa/c;if(Math.abs(c)<1e-30)c=1e-30;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<3e-12)break}return h}
function lgamma(z){const g=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let x=z,y=z,t=x+5.5;t-=(x+.5)*Math.log(t);let s=1.000000000190015;for(const c of g)s+=c/++y;return -t+Math.log(2.5066282746310005*s/x)}
function ibeta(a,b,x){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
function welch(a,b){if(a.length<2||b.length<2)return NaN;const va=sd(a)**2/a.length,vb=sd(b)**2/b.length,t=(mean(a)-mean(b))/Math.sqrt(va+vb),df=(va+vb)**2/(va*va/(a.length-1)+vb*vb/(b.length-1));return ibeta(df/2,.5,df/(df+t*t))}
const q=(a,p)=>{const s=[...a].sort((x,y)=>x-y),i=(s.length-1)*p,lo=Math.floor(i);return s[lo]+(s[Math.min(lo+1,s.length-1)]-s[lo])*(i-lo)};
const f0=v=>isFinite(v)?Math.round(v).toLocaleString('en-US').replace(/,/g,''):'-',f1=v=>isFinite(v)?v.toFixed(1):'-',f2=v=>isFinite(v)?v.toFixed(2):'-',f3=v=>isFinite(v)?v.toFixed(3):'-';
const pct=(v,d=1)=>isFinite(v)?(v*100).toFixed(d)+'%':'-',sp=(v,d=1)=>isFinite(v)?(v>=0?'+':'−')+Math.abs(v*100).toFixed(d)+'%':'-';
const pv=p=>!isFinite(p)?'-':p<0.001?'p &lt; 0.001':'p = '+p.toFixed(3);
// ---------- read excel ----------
function readXlsx(buf){
  const wb=XLSX.read(buf,{type:'array',cellDates:true}); const si=wb.Sheets['입력']; if(!si) throw new Error('「입력」 시트를 찾을 수 없습니다.');
  const v=(sh,a)=>{const c=sh[a];return c?c.v:''};
  const D={names:[v(si,'C6')||'1차',v(si,'C7')||'2차'],lots:[+v(si,'E6')||0,+v(si,'E7')||0],n:[+v(si,'F6')||0,+v(si,'F7')||0],

}
// ---------- analysis ----------
function analyze(D){
  const I=D.info,B=[0,1].map(b=>{
    const L=D.lots[b],n=D.n[b],rows=D.data[b].map((x,i)=>({lot:Math.floor(i/n)+1,pos:i%n+1,g:x[0],t:x[1]}));
    const seq=rows.filter(r=>r.g!=null||r.t!=null); const G=seq.filter(r=>r.g!=null).map(r=>r.g),T=seq.filter(r=>r.t!=null).map(r=>r.t);
    const pr=seq.filter(r=>r.g!=null&&r.t!=null),R=pr.map(r=>r.g/r.t*0.001);

    const outG=seq.filter(r=>r.g!=null&&(r.g<lg.lcl||r.g>lg.ucl)),outT=seq.filter(r=>r.t!=null&&(r.t<lt.lcl||r.t>lt.ucl));

    const grp=(key,N)=>Array.from({length:N},(_,i)=>{const s=rows.filter(r=>r[key]===i+1);const g=s.map(r=>r.g).filter(x=>x!=null),t=s.map(r=>r.t).filter(x=>x!=null);return{k:i+1,g:g.length?mean(g):NaN,gs:sd(g),t:t.length?mean(t):NaN,ts:sd(t)}});
    const byLot=grp('lot',L),byPos=grp('pos',n); const [s_,i_]=fit(pr.map(r=>r.g),pr.map(r=>r.t));
    return{name:D.names[b],L,n,rows,seq,G,T,R,pr,lg,lt,outG,outT,wG:G.filter(inG).length,wT:T.filter(inT).length,wGT:pr.filter(r=>inG(r.g)&&inT(r.t)).length,byLot,byPos,r:corr(pr.map(r=>r.t),pr.map(r=>r.g)),pred:s_*I.tg+i_}
  });
  return{I,B,tr:I.tg/I.tt*0.001};

// ---------- render ----------
const lab=r=>`${r.lot}-${r.pos}`;
function bullets(txt,auto){const lines=String(txt||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const L=lines.length?lines:auto;return '<ul>'+L.map(s=>{const m=s.match(/^([^:：]{1,20})[:：]\s*(.*)$/);return '<li>'+(m?`<b>${esc(m[1])}:</b> ${esc(m[2])}`:esc(s))+'</li>'}).join('')+'</ul>'+(lines.length?'':'<span class="auto">※ 자동 생성 문구 (「보고서 문구」 시트에 입력하면 대체됨)</span>')}
function render(D){
  const A=analyze(D),I=A.I,[a,b]=A.B,T=D.texts||{},ev=T.eval||[],look=T.look||[];
  const stat=arr=>({m:mean(arr),s:sd(arr),mn:mn(arr),mx:mx(arr),cv:sd(arr)/mean(arr)});
  const S={g:[stat(a.G),stat(b.G)],t:[stat(a.T),stat(b.T)],r:[stat(a.R),stat(b.R)]};

  h+='<h3>요약표 평가 칸</h3><div class="form">'+ev.map((l,i)=>`<label>${l}<input data-x="eval" data-i="${i}" value="${esc(T.eval[i]||'')}"></label>`).join('')+'</div>';
  h+='<h3>외관 상태 (차수별)</h3><div class="form">'+lk.map((l,i)=>`<label>${l.replace('차수1',ST.names[0]).replace('차수2',ST.names[1])}<input data-x="look" data-i="${i}" value="${esc(T.look[i]||'')}"></label>`).join('')+'</div>';
  h+=`<div class="form2"><label>✔ 달성된 것<textarea data-x="done" rows="6">${esc(T.done||'')}</textarea></label><label>▲ 남은 과제<textarea data-x="todo" rows="6">${esc(T.todo||'')}</textarea></label></div>`;
  h+='<h3>다음 조치</h3><table class="cfg"><tr><th>No</th><th>조치 내용</th><th>기대 효과</th></tr>'+T.act.map((a,i)=>`<tr><td>${i+1}</td><td><input data-x="act" data-i="${i}" data-j="0" value="${esc(a[0]||'')}"></td><td><input data-x="act" data-i="${i}" data-j="1" value="${esc(a[1]||'')}"></td></tr>`).join('')+'</table><button class="mini" id="addAct">조치 행 추가</button>';
  $('#pText').innerHTML=h;
  $('#pText').querySelectorAll('[data-x]').forEach(x=>x.oninput=()=>{const k=x.dataset.x;if(k==='eval'||k==='look')T[k][+x.dataset.i]=x.value;else if(k==='act')T.act[+x.dataset.i][+x.dataset.j]=x.value;else T[k]=x.value;autosave()});
  $('#addAct').onclick=()=>{T.act.push(['','']);drawTexts();autosave()};
}
// ---------- preview & export ----------
function preview(){const D=toD(ST);const bad=[0,1].filter(b=>!D.data[b].some(x=>x[0]!=null||x[1]!=null));
  if(bad.length){$('#rep').innerHTML='<p style="padding:40px;text-align:center;color:#b42318">'+bad.map(b=>esc(ST.names[b])).join(', ')+' 데이터가 비어 있습니다. ② 시편 데이터 탭에서 입력해 주세요.</p>';return false}
  try{render(D);return true}catch(e){$('#rep').innerHTML='<p style="color:#b42318">보고서를 만들 수 없습니다: '+esc(e.message)+'</p>';return false}}
let dl=null;(async()=>{try{dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null}catch(e){}})();
async function saveFile(name,blob){
  if(dl){try{await dl.save({filename:name,data:blob});msg('저장했습니다: '+name)}catch(e){msg(e&&e.code==='declined'?'저장을 취소했습니다':'저장 실패: '+(e&&e.message||e))}return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);msg('저장했습니다: '+name)}catch(e){msg('이 화면에서는 다운로드가 차단되었습니다')}}
const fname=ext=>`${(ST.info.prd||'OxyFelt').replace(/[\\/:*?"<>|]/g,'')}_조건셋업_보고서_${(ST.info.date||new Date().toISOString().slice(0,10))}.${ext}`;
async function chartsToImages(root){const swaps=[];for(const d of root.querySelectorAll('.js-plotly-plot')){try{const url=await Plotly.toImage(d,{format:'png',scale:2,width:d.clientWidth,height:d.clientHeight});const img=new Image();img.src=url;img.style.width=d.clientWidth+'px';img.style.height=d.clientHeight+'px';img.style.display='block';await img.decode().catch(()=>{});d.style.display='none';d.parentNode.insertBefore(img,d);swaps.push([d,img])}catch(e){}}return()=>swaps.forEach(([d,img])=>{img.remove();d.style.display=''})}
function busy(on,t){$('#busy').hidden=!on;if(t)$('#busyT').textContent=t}
async function prepare(){tab('pPrev');if(!preview())throw new Error('데이터를 먼저 입력해 주세요');await new Promise(r=>setTimeout(r,700));const rep=$('#rep');rep.classList.add('exporting');await new Promise(r=>setTimeout(r,300));
  window.dispatchEvent(new Event('resize'));await new Promise(r=>setTimeout(r,500));const restore=await chartsToImages(rep);return()=>{restore();rep.classList.remove('exporting');window.dispatchEvent(new Event('resize'))}}
async function exportPNG(){if(!window.html2canvas)return msg('이미지 변환 모듈을 불러오지 못했습니다(인터넷 연결 확인)');busy(true,'이미지 만드는 중…');let restore=()=>{};
  try{restore=await prepare();const c=await html2canvas($('#rep'),{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});const blob=await new Promise(r=>c.toBlob(r,'image/png'));restore();restore=()=>{};busy(false);await saveFile(fname('png'),blob)}
  catch(e){msg('이미지 만들기 실패: '+e.message)}finally{restore();busy(false)}}
async function exportPDF(){if(!window.html2canvas||!window.jspdf)return msg('PDF 변환 모듈을 불러오지 못했습니다(인터넷 연결 확인)');busy(true,'PDF 만드는 중…');let restore=()=>{};
  try{restore=await prepare();const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'mm',format:'a4',orientation:'portrait'});
    const PW=210,PH=297,M=10,W=PW-2*M,H=PH-2*M;let y=M,first=true;
    const blocks=[];$('#rep').querySelectorAll(':scope > header, :scope > section > *').forEach(el=>{if(el.tagName==='FIGURE'&&el.querySelector('.g2')&&el.querySelectorAll('.g2 > *').length>2){blocks.push(el)}else blocks.push(el)});
    for(let i=0;i<blocks.length;i++){const el=blocks[i];busy(true,`PDF 만드는 중… (${i+1}/${blocks.length})`);
      const c=await html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});const hmm=c.height*W/c.width;
      const keepNext=/^H2$/.test(el.tagName);
      let need=hmm; if(keepNext&&blocks[i+1]){need+=Math.min(60,blocks[i+1].offsetHeight*W/el.offsetWidth)}
      if(y+need>M+H&&y>M+1){pdf.addPage();y=M}
      if(hmm<=H){pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',M,y,W,hmm);y+=hmm+2}
      else{const pxPerMm=c.width/W;let off=0;while(off<c.height){const sliceH=Math.min(c.height-off,Math.floor((M+H-y)*pxPerMm));const s=document.createElement('canvas');s.width=c.width;s.height=sliceH;s.getContext('2d').drawImage(c,0,off,c.width,sliceH,0,0,c.width,sliceH);
        pdf.addImage(s.toDataURL('image/jpeg',0.92),'JPEG',M,y,W,sliceH/pxPerMm);off+=sliceH;y+=sliceH/pxPerMm+2;if(off<c.height){pdf.addPage();y=M}}}}
    const n=pdf.getNumberOfPages();for(let p=1;p<=n;p++){pdf.setPage(p);pdf.setFontSize(8);pdf.setTextColor(150);pdf.text(`${p} / ${n}`,PW/2,PH-4,{align:'center'})}
    const blob=pdf.output('blob');restore();restore=()=>{};busy(false);await saveFile(fname('pdf'),blob)}
  catch(e){msg('PDF 만들기 실패: '+e.message)}finally{restore();busy(false)}}
$('#bPNG').onclick=exportPNG;$('#bPDF').onclick=exportPDF;
// ---------- work file ----------
$('#bSave').onclick=()=>saveFile(fname('json').replace('_보고서_','_작업_'),new Blob([JSON.stringify({app:'oxyfelt-report',ver:APP_VERSION,state:ST},null,1)],{type:'application/json'}));
$('#fJson').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const o=JSON.parse(await f.text());if(!o.state)throw new Error('작업 파일 형식이 아닙니다');ST=o.state;ensureTexts();drawAll();autosave();msg('작업을 불러왔습니다: '+f.name)}catch(err){msg('불러오기 실패: '+err.message)}e.target.value=''};
$('#fXlsx').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(!window.XLSX||!XLSX.read)throw new Error('엑셀 모듈을 불러오지 못했습니다');const D=readXlsx(new Uint8Array(await f.arrayBuffer()));const t=D.texts&&Object.keys(D.texts).length?D.texts:ST.texts;ST=fromD({...D,texts:t});ensureTexts();drawAll();autosave();msg('엑셀을 불러왔습니다: '+f.name)}catch(err){msg('엑셀 불러오기 실패: '+err.message)}e.target.value=''};
$('#bNew').onclick=()=>{const x=$('#bNew');if(!x.dataset.ok){x.dataset.ok=1;x.textContent='정말 새로 시작? 한 번 더';setTimeout(()=>{delete x.dataset.ok;x.textContent='새로 시작'},3000);return}
  ST={names:['1차','2차'],lots:[5,5],n:[10,10],info:{prd:'',date:new Date().toISOString().slice(0,10),author:'',tg:ST.info.tg,tt:ST.info.tt,gTol:ST.info.gTol,tTol:ST.info.tTol,memo1:'',memo2:''},grid:[0,1].map(()=>({g:Array.from({length:5},()=>Array(10).fill(null)),t:Array.from({length:5},()=>Array(10).fill(null))})),texts:{},checks:ST.checks.map(c=>({item:c.item,std:c.std,r1:'',r2:'',judge:''})),caution:ST.caution};ensureTexts();drawAll();autosave();delete x.dataset.ok;x.textContent='새로 시작';msg('빈 양식으로 시작합니다(목표값은 유지)')};
$('#bEx').onclick=()=>{ST=fromD(DEF);ensureTexts();drawAll();autosave();msg('예시 데이터를 불러왔습니다')};
// ---------- version ----------
$('#ver').textContent='v'+APP_VERSION;
$('#ver').onclick=()=>{$('#log').hidden=!$('#log').hidden};
$('#log').innerHTML='<b>업데이트 내역</b><ul>'+CHANGELOG.map(([v,d,t])=>`<li><b>v${v}</b> (${d}) ${esc(t)}</li>`).join('')+'</ul><p class="hint">관리자가 새 버전을 배포하면 이 링크를 여는 모든 사용자에게 자동 적용됩니다. 입력한 데이터는 각자의 브라우저에 자동 저장되며 업데이트 후에도 유지됩니다.</p>';
if(saved&&saved.ver&&saved.ver!==APP_VERSION){setTimeout(()=>msg(`v${APP_VERSION}(으)로 업데이트되었습니다. 업데이트 내역은 버전 표시를 누르세요.`),600)}
function drawAll(){drawSettings();drawTexts();if(!$('#pData').hidden)drawGrids();if(!$('#pPrev').hidden)preview()}
drawSettings();drawTexts();tab('pData');

// ---------- 새 버전 확인 (웹 호스팅 시) ----------
(function(){if(!/^https?:/.test(location.protocol)||/claude/.test(location.hostname))return;
  const chk=async()=>{try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const v=await r.json();
    if(v.version&&v.version!==APP_VERSION&&!document.getElementById('upd')){const d=document.createElement('div');d.id='upd';
      d.innerHTML=`새 버전 v${esc(v.version)}이 배포되었습니다. ${esc(v.note||'')} <button>지금 적용(새로고침)</button>`;d.querySelector('button').onclick=()=>location.reload();document.body.prepend(d)}}catch(e){}};
  setTimeout(chk,3000);setInterval(chk,10*60*1000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)chk()})})();

</script></body></html>
